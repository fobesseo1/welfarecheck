<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>요양원 길잡이 · 사진 적용 시안</title><style>body{margin:0;background:#f3f6f4;color:#28352e;font-family:"Malgun Gothic",sans-serif}main{max-width:1440px;margin:auto;padding:35px 24px}h1{font-size:28px}p{color:#65796d;line-height:1.8}.grid{display:grid;grid-template-columns:2fr 1fr;gap:30px;align-items:start}figure{margin:0}figcaption{padding:16px 0;font-weight:bold}img{display:block;width:100%;background:white;border-radius:12px;box-shadow:0 12px 36px #18302412}a{color:#167754}@media(max-width:800px){.grid{grid-template-columns:1fr}.mobile{max-width:480px}}</style><main><h1>사진을 더한 홈페이지 시안</h1><p>기존 흰색·민트색 디자인에 가족 히어로와 세 가지 돌봄 서비스 사진을 배치했습니다.<br>이미지 생성 도구로 만든 배치 검토용 시안입니다. 모바일 이미지는 사진이 적용된 주요 구간을 보여 줍니다.</p><div class="grid"><figure><figcaption>컴퓨터 · 가족 사진과 결과 카드의 조합</figcaption><a href="desktop-with-photos.png"><img src="desktop-with-photos.png" alt="컴퓨터 사진 적용 시안"></a></figure><figure class="mobile"><figcaption>휴대폰 · 글 → 가족 사진 → 상담 버튼</figcaption><a href="mobile-with-photos.png"><img src="mobile-with-photos.png" alt="휴대폰 사진 적용 시안"></a></figure></div><p>사진 배치: 첫 화면 가족 / 요양원 대화 / 주야간보호 활동 / 방문요양 식사 지원. 문구와 운영 정보는 실제 제작 시 원래 사이트의 확정 내용을 적용합니다.</p></main></html>
